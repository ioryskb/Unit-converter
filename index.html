<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Unit Converter</title>
</head>
<body>
    <div class="container">
        <div class="heading-area">
            <h3>Unit Converter</h3>
            <i>⚙️</i>
        </div>
    
        <div class="convertion-menu">
            <header>What would you like to convert?</header>
            <button id="temperature">Fahrenheit to Celcius</button>
            <button id="weight">Pounds to Kilogram</button>
        </div>
        <div class="conversion-area hide-display">
        <!-- Temperature calculation area -->
            <div class="temperature-calculation hide-display">

                <div class="fahrenheit">
                    <p>°F</p>
                    <input type="number" id="fahrenheit-value">
                </div>

                <div class="celsius">
                    <p>°C</p>
                    <input type="number" id="celsius-value">
                </div>

                

            </div>
        <!-- Temperature calculation area end -->

        <!-- Weight calculation area -->
            <div class="weight-calculation hide-display">

                <div class="pounds">
                    <p>Pounds</p>
                    <input type="number" id="pound-value">
                </div>

                <div class="kilogram">
                    <p>Kilogram</p>
                    <input type="number" id="kilogram-value">
                </div>

            </div>
        <!-- Weight calculation area end -->
            <div class="calculation-Btn">
                <button id="convert-temp">Convert</button>
                <button id="back">Back</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
